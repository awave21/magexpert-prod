openapi: 3.1.0
info:
  title: Sender API
  version: 1.0.0
  description: |
    Публичный API сервиса рассылок Sender. Через него внешние системы (в том числе сайт MagExpert) отправляют
    служебные письма, сообщают о согласии на рассылку и ведут базы подписчиков. Прямых вызовов кода Sender
    из других систем быть не должно: единственный интерфейс, это этот контракт.

    ## Общие правила

    - Базовый адрес: `{SENDER_API_URL}/api/sender/v1`. Версия в пути; несовместимые изменения выходят как `v2`.
    - Авторизация: `Authorization: Bearer <API-ключ организации>`. Ключ создаётся в админке Sender.
    - Формат: `application/json`, UTF-8. Заголовок `Accept` не обязателен, ответ всегда JSON.
    - Время: ISO 8601 (`2026-10-14T15:19:10+03:00`).
    - Ошибки: `application/problem+json` (RFC 9457). Поля `message` и `errors` оставлены для совместимости
      с клиентами, которые их уже читают. Заблокированное письмо возвращается как ресурс `Message` с кодом 422
      и `status: blocked`, а не как ошибка.
    - Лимиты: `429 Too Many Requests` с заголовком `Retry-After`.
    - Трассировка: любой запрос может нести `X-Request-Id`; Sender возвращает его в ответе и сохраняет у письма
      (`request_id`), поэтому письмо находят по следу в логах клиента.
    - Идемпотентность: `POST /messages` принимает `Idempotency-Key`. Повтор с тем же ключом возвращает то же письмо
      с заголовком `Idempotent-Replayed: true`; тот же ключ для другого письма даёт 422.

    ## Отправитель письма

    Адрес и имя отправителя определяет шаблон в Sender. В запросе их передать нельзя: поля `from` и `from_name`
    игнорируются. Если у шаблона не задан адрес отправителя, письмо получает статус `blocked`.

    ## Анкета подписчика

    Обязателен только `email`. Остальные базовые поля (`name`, `phone`, `city`) необязательны, как и дополнительные
    атрибуты. Базовые поля: `email`, `name`, `phone`, `city`. Дополнительные необязательные атрибуты
    передаются объектом `attributes`; они становятся переменными письма (`{{ specialization }}`) и полями базы.
    Передан атрибут, значение сохраняется; не передан, остаётся прежним. Названия атрибутов: латиница в нижнем
    регистре, цифры и `_`, до 50 символов; значения: строка, число, `true/false` или `null`. Базовые поля
    в `attributes` передавать нельзя. Объект `data` принимается как прежний синоним `attributes`.
    Телефон приводится к виду `+79991234567` (российские `8…` и `7…` переводятся в `+7…`).

    ## Устаревшие методы

    Помечены `deprecated: true` и возвращают заголовок `Deprecation: true`. Продолжают работать; замена указана
    в описании метода.

    | Устарел | Замена |
    |---|---|
    | `PUT /lists` | `GET /lists?name=` и `POST /lists` |
    | `PUT /lists/{list}/contacts` | `PUT /lists/{list}/contacts/{email}` |
    | `PUT /subscriptions` | `PUT /contacts/{email}/subscription` |

    ## Известные отступления

    - Ответы `POST /messages`, `GET /messages/{uuid}` и `PUT /subscriptions` без обёртки `data`; в новых методах
      ответ всегда в `data`. Приведение к единому виду потребует `v2`.
    - Недоступная для записи база даёт 409 в новых методах и 422 в устаревших операциях с контактами.
  contact:
    name: Sender
servers:
  - url: https://mail.mag-expert.ru/api/sender/v1
    description: Продакшн
security:
  - bearerAuth: []
tags:
  - name: Messages
    description: Отправка служебных писем по шаблону
  - name: Subscriptions
    description: Согласие адреса на рассылки
  - name: Lists
    description: Базы подписчиков
  - name: Contacts
    description: Подписчики базы и их теги
paths:
  /messages:
    post:
      tags: [Messages]
      operationId: createMessage
      summary: Отправить письмо по шаблону
      description: |
        Ставит письмо в очередь отправки и сразу отвечает. Шаблон задаёт тему, содержимое и отправителя.
        Переменные шаблона передаются в `data`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessage'
            example:
              template: event-registration
              to: anna@example.com
              data:
                first_name: Анна
                event_title: Школа гинекологии
                event_url: https://mag-expert.ru/events/shkola-ginekologii
                start_date: 15.11.2026
                speakers:
                  - name: Иван Иванов
                    regalia: Д.м.н., профессор
                    photo: https://mag-expert.ru/storage/speakers/1.webp
      responses:
        '202':
          description: Письмо принято и поставлено в очередь
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: |
            Запрос не прошёл проверку (`application/problem+json`) либо письмо заблокировано (`application/json`,
            ресурс `Message` со `status: blocked` и причиной в `error`) либо `Idempotency-Key` уже использован
            для другого письма.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /messages/{uuid}:
    get:
      tags: [Messages]
      operationId: getMessage
      summary: Статус письма
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Письмо
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /subscriptions:
    put:
      tags: [Subscriptions]
      deprecated: true
      operationId: setSubscription
      summary: Согласен ли адрес получать рассылки (устарел)
      description: |
        Устарел: используйте `PUT /contacts/{email}/subscription`.
        Служебные письма (сброс пароля, регистрация) отписка не затрагивает. Отписанному адресу рассылки не
        отправляются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSubscription'
      responses:
        '200':
          description: Состояние подписки после изменения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /contacts/{email}/subscription:
    put:
      tags: [Subscriptions]
      operationId: setContactSubscription
      summary: Согласие адреса на рассылки
      description: |
        Каноничный метод вместо `PUT /subscriptions`: адрес в пути. Служебные письма (сброс пароля, регистрация)
        отписка не затрагивает; отписанному адресу рассылки не отправляются.
      parameters:
        - $ref: '#/components/parameters/Email'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetContactSubscription'
      responses:
        '200':
          description: Состояние подписки после изменения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /contacts/{email}:
    delete:
      tags: [Contacts]
      operationId: deleteContactEverywhere
      summary: Убрать адрес из всех баз организации
      description: |
        Для права на удаление данных: адрес пропадает из всех баз, в том числе собираемых автоматически.
        Операция идемпотентна: если адреса в базах нет, ответ тот же. Отправленные письма остаются в журнале,
        блок-лист и отписки не меняются.
      parameters:
        - $ref: '#/components/parameters/Email'
      responses:
        '204':
          description: Адреса больше нет в базах организации
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /lists:
    get:
      tags: [Lists]
      operationId: listLists
      summary: Базы организации
      description: С параметром `name` возвращает только базу с таким названием (без учёта регистра и пробелов по краям).
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
      responses:
        '200':
          description: Список баз (может быть пустым)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Lists]
      operationId: createList
      summary: Создать базу
      description: Название занято, значит 409 и `list_id` существующей базы.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertList'
      responses:
        '201':
          description: База создана
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [Lists]
      deprecated: true
      operationId: upsertList
      summary: Найти базу по названию или создать (устарел)
      description: |
        Устарел: используйте `GET /lists?name=` и `POST /lists`.
        Название сравнивается без учёта регистра и пробелов по краям. База, которая собирается из источника
        автоматически, через API не меняется (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertList'
      responses:
        '200':
          description: База уже была
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelope'
        '201':
          description: База создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /lists/{list}/contacts/{email}:
    put:
      tags: [Contacts]
      operationId: putContact
      summary: Добавить или обновить подписчика (анкета)
      description: |
        Каноничный метод: адрес в пути. Тело описывает анкету: базовые поля `name`, `phone`, `city` и необязательные
        `attributes`. Теги **добавляются** к уже стоящим. Поле `subscribed` меняет согласие; не передано, остаётся
        прежним. База, которая собирается автоматически, отвечает 409.
      parameters:
        - $ref: '#/components/parameters/ListId'
        - $ref: '#/components/parameters/Email'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactProfile'
            example:
              name: Анна Иванова
              phone: '+79991234567'
              city: Москва
              attributes:
                specialization: Гинеколог
                company: Клиника «Пример»
              subscribed: true
              tags: [shkola-ginekologii, '2026-11-15']
      responses:
        '200':
          description: Подписчик обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResultEnvelope'
        '201':
          description: Подписчик создан
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResultEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags: [Contacts]
      operationId: getContact
      summary: Подписчик базы
      parameters:
        - $ref: '#/components/parameters/ListId'
        - $ref: '#/components/parameters/Email'
      responses:
        '200':
          description: Подписчик
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Contacts]
      operationId: deleteContact
      summary: Удалить подписчика из базы
      description: Отправленные подписчику письма остаются в журнале.
      parameters:
        - $ref: '#/components/parameters/ListId'
        - $ref: '#/components/parameters/Email'
      responses:
        '204':
          description: Подписчик удалён
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /lists/{list}/contacts:
    put:
      tags: [Contacts]
      deprecated: true
      operationId: upsertContact
      summary: Добавить или обновить подписчика (устарел)
      description: |
        Устарел: используйте `PUT /lists/{list}/contacts/{email}`.
        Подписчик ищется по email. Теги **добавляются** к уже стоящим и ничего не затирают. Поле `subscribed`
        меняет согласие; если оно не передано, согласие остаётся как было.
      parameters:
        - $ref: '#/components/parameters/ListId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertContact'
            example:
              email: anna@example.com
              name: Анна Иванова
              data:
                city: Москва
              subscribed: true
              tags: [shkola-ginekologii, '2026-11-15']
      responses:
        '200':
          description: Подписчик обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResultEnvelope'
        '201':
          description: Подписчик создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResultEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /lists/{list}/contacts/batch:
    post:
      tags: [Contacts]
      operationId: upsertContactsBatch
      summary: Добавить или обновить подписчиков пакетом
      description: |
        До 1000 подписчиков за запрос. Корректные строки применяются, ошибочные возвращаются в `invalid`
        с номером строки (с нуля): пакет из-за них не отклоняется.
      parameters:
        - $ref: '#/components/parameters/ListId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchContacts'
      responses:
        '200':
          description: Итог применения пакета
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResultEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
webhooks:
  recipient.unsubscribed:
    post:
      tags: [Subscriptions]
      operationId: webhookRecipientUnsubscribed
      summary: Адрес отписался от рассылок
      description: |
        Sender отправляет событие на адрес вебхука, заданный в разделе «Вебхуки». Заголовки запроса:

        - `X-Sender-Event`: название события;
        - `X-Sender-Event-Id`: идентификатор события, один на все повторные доставки (совпадает с полем `id` тела);
        - `X-Sender-Timestamp`: время отправки, секунды Unix;
        - `X-Sender-Signature-V2: sha256=<hex>`: HMAC-SHA256 секретом вебхука от строки `{timestamp}.{тело}`;
        - `X-Sender-Signature: sha256=<hex>`: прежняя подпись только тела (оставлена для совместимости, для новых
          получателей не рекомендуется).

        Получатель обязан проверить подпись V2, отклонить запрос, если время старше 5 минут, и не обрабатывать
        повторно событие с уже виденным `id`. Ответ 2xx подтверждает приём; иначе Sender повторяет доставку
        через 1, 5, 15 и 60 минут.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnsubscribedEvent'
      responses:
        '204':
          description: Событие принято
  message.complained:
    post:
      tags: [Messages]
      operationId: webhookMessageComplained
      summary: Получатель пожаловался на письмо
      description: Адрес автоматически отписывается и попадает в блок-лист. Подпись и ответы как у `recipient.unsubscribed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplainedEvent'
      responses:
        '204':
          description: Событие принято
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API-ключ организации (`mxs_…`)
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Сквозной идентификатор запроса клиента (8–64 символа: латиница, цифры, `.`, `_`, `-`). Не передан или
        некорректен, значит Sender создаёт свой. Возвращается в заголовке ответа и сохраняется у письма (`request_id`).
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{8,64}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Ключ операции на стороне клиента, до 255 видимых ASCII-символов без пробелов. Повтор запроса с тем же
        ключом не создаёт второе письмо.
      schema:
        type: string
        maxLength: 255
        pattern: '^[\x21-\x7E]+$'
    ListId:
      name: list
      in: path
      required: true
      schema:
        type: integer
    Email:
      name: email
      in: path
      required: true
      description: Адрес подписчика, URL-кодированный
      schema:
        type: string
        format: email
  headers:
    IdempotentReplayed:
      description: '`true`, если ответ повторён по ранее использованному `Idempotency-Key`'
      schema:
        type: string
        enum: ['true']
  responses:
    Unauthorized:
      description: Неверный или отозванный API-ключ
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Шаблон, письмо, база или подписчик не найдены
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: База собирается автоматически и через API не меняется
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Запрос не прошёл проверку
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Превышен лимит запросов
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    UnsubscribedEvent:
      type: object
      required: [id, event, occurred_at, email]
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор события; один на все повторные доставки
        event:
          type: string
          enum: [recipient.unsubscribed]
        occurred_at:
          type: string
          format: date-time
        email:
          type: string
          format: email
        campaign_id:
          type:
            - integer
            - 'null'
    ComplainedEvent:
      type: object
      required: [id, event, occurred_at, message]
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор события; один на все повторные доставки
        event:
          type: string
          enum: [message.complained]
        occurred_at:
          type: string
          format: date-time
        message:
          type: object
          required: [id, to, subject, status]
          properties:
            id:
              type: string
              format: uuid
            to:
              type: string
              format: email
            subject:
              type: string
            status:
              type: string
            campaign_id:
              type:
                - integer
                - 'null'
    Problem:
      type: object
      description: Ошибка (RFC 9457) с полями, которые читают текущие клиенты
      required: [type, title, status, detail, message]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Unprocessable Content
        status:
          type: integer
          example: 422
        detail:
          type: string
        message:
          type: string
          description: То же, что `detail`; оставлено для совместимости
        errors:
          type: object
          description: Ошибки проверки по полям
          additionalProperties:
            type: array
            items:
              type: string
    CreateMessage:
      type: object
      required: [template, to]
      properties:
        template:
          type: string
          description: Идентификатор шаблона (slug) или его числовой ID
          example: event-registration
        to:
          type: string
          format: email
        data:
          type: object
          description: |
            Переменные шаблона. Допустимы строки, числа, `true/false` и списки объектов для блока `{{#each}}`.
            Ключи `from` и `from_name` здесь, как и на верхнем уровне, игнорируются.
          additionalProperties: true
    Message:
      type: object
      required: [id, status, to, subject, attempts, error, request_id, sent_at]
      properties:
        id:
          type: string
          format: uuid
        request_id:
          type:
            - string
            - 'null'
          description: Идентификатор запроса клиента (`X-Request-Id`), по которому письмо создано
        status:
          type: string
          enum: [queued, sending, sent, delivered, failed, bounced, blocked]
        to:
          type: string
          format: email
        subject:
          type: string
        attempts:
          type: integer
        error:
          type:
            - string
            - 'null'
          description: Причина блокировки или сбоя
        sent_at:
          type:
            - string
            - 'null'
          format: date-time
    SetSubscription:
      type: object
      required: [email, subscribed]
      properties:
        email:
          type: string
          format: email
        subscribed:
          type: boolean
    Subscription:
      type: object
      required: [email, subscribed]
      properties:
        email:
          type: string
          format: email
        subscribed:
          type: boolean
    SetContactSubscription:
      type: object
      required: [subscribed]
      properties:
        subscribed:
          type: boolean
    SubscriptionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Subscription'
    ListCollection:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/List'
    UpsertList:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type:
            - string
            - 'null'
          maxLength: 500
    List:
      type: object
      required: [id, name, description, require_confirmation, contacts_count, subscribed_count, pending_count, created_at]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        require_confirmation:
          type: boolean
        contacts_count:
          type: integer
        subscribed_count:
          type: integer
        pending_count:
          type: integer
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    ListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/List'
    ContactProfile:
      type: object
      description: |
        Анкета подписчика без адреса (адрес в пути). Базовые поля `name`, `phone`, `city`; дополнительные
        необязательные атрибуты в `attributes`.
      properties:
        name:
          type:
            - string
            - 'null'
          maxLength: 250
          description: Имя подписчика
        phone:
          type:
            - string
            - 'null'
          pattern: '^\+?[0-9]{10,15}$'
          description: |
            Телефон: от 10 до 15 цифр, можно с ведущим `+`. Пробелы, скобки и дефисы убираются, российские
            `8…` и `7…` приводятся к `+7…`.
        city:
          type:
            - string
            - 'null'
          maxLength: 120
          description: Город
        attributes:
          type:
            - object
            - 'null'
          description: |
            Дополнительные необязательные атрибуты анкеты. Ключ: латиница в нижнем регистре, цифры и `_`,
            начинается с буквы, до 50 символов; не больше 50 атрибутов. Значение: строка (до 1000 символов), число,
            `true/false` или `null`. Базовые поля (`email`, `name`, `phone`, `city`) здесь передавать нельзя.
            Переданные атрибуты заполняются; не переданные не меняются; значение `null` очищает атрибут.
            Значения хранятся строками (`true` как `1`, `false` как `0`).
          additionalProperties: true
        data:
          type:
            - object
            - 'null'
          deprecated: true
          description: Прежнее название `attributes`; принимается как синоним, `attributes` главнее.
          additionalProperties: true
        subscribed:
          type: boolean
          description: Согласие на рассылки. Не передано, значит остаётся прежним.
        tags:
          type:
            - array
            - 'null'
          description: Теги добавляются к имеющимся
          items:
            $ref: '#/components/schemas/Tag'
    UpsertContact:
      description: 'Устаревший вид: анкета с адресом в теле (`PUT /lists/{list}/contacts` и пакетная загрузка).'
      allOf:
        - $ref: '#/components/schemas/ContactProfile'
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
    Tag:
      type: string
      maxLength: 120
      pattern: '^[\p{L}\p{N}][\p{L}\p{N} _.:,\-()/+]{0,119}$'
      description: |
        Буквы любого алфавита, цифры, пробел и `_ . : , - ( ) / +`; начинается с буквы или цифры, до 120 символов.
        Регистр приводится к нижнему.
    ContactStatus:
      type: string
      enum: [subscribed, pending, unsubscribed]
    ContactResult:
      type: object
      required: [email, status, created]
      properties:
        email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/ContactStatus'
        created:
          type: boolean
    ContactResultEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ContactResult'
    Contact:
      type: object
      required: [email, name, phone, city, attributes, data, tags, status, created_at, updated_at]
      properties:
        email:
          type: string
          format: email
        name:
          type:
            - string
            - 'null'
        phone:
          type:
            - string
            - 'null'
        city:
          type:
            - string
            - 'null'
        attributes:
          type: object
          description: Дополнительные атрибуты анкеты (без `phone` и `city`)
          additionalProperties: true
        data:
          type: object
          deprecated: true
          description: Полный набор полей, включая `phone` и `city`; оставлен для совместимости
          additionalProperties: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        status:
          $ref: '#/components/schemas/ContactStatus'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    ContactEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Contact'
    BatchContacts:
      type: object
      required: [contacts]
      properties:
        contacts:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/UpsertContact'
    BatchResult:
      type: object
      required: [created, updated, subscribed, pending, unsubscribed, invalid]
      properties:
        created:
          type: integer
        updated:
          type: integer
        subscribed:
          type: integer
        pending:
          type: integer
        unsubscribed:
          type: integer
        invalid:
          type: array
          items:
            type: object
            required: [index, email, errors]
            properties:
              index:
                type: integer
                description: Номер строки в пакете, с нуля
              email:
                type:
                  - string
                  - 'null'
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
    BatchResultEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/BatchResult'
